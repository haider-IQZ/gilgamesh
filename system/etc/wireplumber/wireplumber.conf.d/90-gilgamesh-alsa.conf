# WirePlumber adds 2048 frames of headroom (~43 ms) to PCI audio in a VM, meant for emulated cards.
# HDMI/DisplayPort audio is always a real (passed-through) GPU's (emulated cards are analog only), so
# it needs none. Also never suspend it (no cut-off first sound).
monitor.alsa.rules = [
  { matches = [ { node.name = "~alsa_output.pci.*hdmi.*" } ]
    actions = { update-props = { api.alsa.headroom = 0, session.suspend-timeout-seconds = 0 } } }
]
