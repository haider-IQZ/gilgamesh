# Gilgamesh memory and kernel tuning. Swap is zram only (compressed RAM), so swapping is cheap.
# prefer swapping to zram over dropping page cache (Arch wiki, zram)
vm.swappiness = 180
# no swap readahead: zram is random access
vm.page-cluster = 0
# no bursts of early reclaim
vm.watermark_boost_factor = 0
# start reclaiming a little earlier
vm.watermark_scale_factor = 125
# keep directory/inode caches longer (CachyOS)
vm.vfs_cache_pressure = 50
# 256 MB before writers have to flush themselves (CachyOS)
vm.dirty_bytes = 268435456
# background flushing starts at 64 MB (CachyOS)
vm.dirty_background_bytes = 67108864
# flusher wakes every 15 s instead of 5 (CachyOS)
vm.dirty_writeback_centisecs = 1500
# no NMI watchdog: less overhead, faster boot
kernel.nmi_watchdog = 0
# keep kernel chatter off the console
kernel.printk = 3 3 3 3
