# Portal backends for Hyprland sessions (xdg-desktop-portal reads <desktop>-portals.conf):
# xdg-desktop-portal-hyprland for what it implements (screen sharing, screenshots, global
# shortcuts), xdg-desktop-portal-gtk for everything else: file dialogs, and the Settings
# interface that hands Firefox and libadwaita apps the dark color scheme from dconf.
[preferred]
default=hyprland;gtk
