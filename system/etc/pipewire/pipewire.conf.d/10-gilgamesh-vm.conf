# PipeWire sees QEMU and assumes an emulated sound card (min quantum 1024 = 21 ms). Gilgamesh's
# audio is the passed-through GPU's real HDMI audio, so allow low latency again.
context.properties.rules = [
  { matches = [ { cpu.vm.name = !null } ]
    actions = { update-props = { default.clock.min-quantum = 32 } } }
]
