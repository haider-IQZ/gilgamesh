# Gilgamesh package builds ([gilgamesh] repo). Goes in /etc/makepkg.conf.d/ in the build
# container: makepkg sources it right after /etc/makepkg.conf, so it edits Arch's values
# instead of replacing them.

# Shared with tkg and DKMS for this run.
MAKEFLAGS="-j${BUILD_JOBS:-$(nproc)}"

# Arch's devtools level
COMPRESSZST=(zstd -c "-T${BUILD_JOBS:-$(nproc)}" --ultra -20 -)

# no -debug split packages; makepkg reads OPTIONS from the end, so this beats Arch's "debug"
OPTIONS+=(!debug)

# x86-64-v3 tuned for Zen 3 (not -march=native: packages must run in test VMs too).
# Swaps only Arch's -march/-mtune pair; the other flags and LTO stay. The kernel ignores
# CFLAGS (tkg sets its own -march from _processor_opt).
CFLAGS=${CFLAGS/-march=x86-64 -mtune=generic/-march=x86-64-v3 -mtune=znver3}
CXXFLAGS=${CXXFLAGS/-march=x86-64 -mtune=generic/-march=x86-64-v3 -mtune=znver3}
