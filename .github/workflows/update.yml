name: Update packages
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: 'Force rebuild: comma-separated package directories, linux-tkg, or all'
        type: string
        default: ''
permissions:
  contents: read
# Shared across update.yml and build.yml. Never cancel an active publisher.
concurrency:
  group: gilgamesh-repository-main
  cancel-in-progress: false
jobs:
  pipeline:
    if: github.ref == 'refs/heads/main' && (vars.GILGAMESH_PUBLISH_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/pipeline.yml
    with:
      mode: update
      rebuild: ${{ inputs.rebuild || '' }}
  publication:
    needs: pipeline
    if: always() && vars.GILGAMESH_PUBLISH_ENABLED == 'true' && needs.pipeline.result != 'cancelled' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      issues: write
